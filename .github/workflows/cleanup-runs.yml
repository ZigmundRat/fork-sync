
name: Cleanup Workflow Runs

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository (blank = current repository)'
        required: false
        type: string
        default: ''

      workflow:
        description: 'Workflow name (blank = all workflows)'
        required: false
        type: string
        default: ''

      dry_run:
        description: 'Preview only - do not delete'
        required: true
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup completed workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPO: ${{ inputs.repository }}
          TARGET_WORKFLOW: ${{ inputs.workflow }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          repo="${TARGET_REPO:-$GITHUB_REPOSITORY}"
          workflow="$TARGET_WORKFLOW"

          echo "========================================"
          echo " Workflow Run Cleanup"
          echo "========================================"
          echo "Repository: $repo"
          echo "Workflow filter: ${workflow:-ALL}"
          echo "Preview only: $DRY_RUN"
          echo ""

          runs=$(mktemp)
          trap 'rm -f "$runs"' EXIT

          # Retrieve all completed runs, including pagination
          echo "Fetching completed workflow runs..."

          if ! gh api --paginate \
            "repos/$repo/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .name] | @tsv' \
            > "$runs"; then
            echo "::error::Failed to retrieve runs for $repo"
            exit 1
          fi

          total=$(wc -l < "$runs")
          echo "Total completed runs found: $total"
          echo ""

          # Initialize job summary
          {
            echo "## Workflow Run Cleanup"
            echo ""
            echo "**Repository:** \`$repo\`"
            echo ""
            echo "**Workflow filter:** \`${workflow:-ALL}\`"
            echo ""
            echo "**Preview only:** $DRY_RUN"
            echo ""
            echo "**Total completed runs:** $total"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Show available workflows
          echo "Available workflow names:"
          if (( total > 0 )); then
            cut -f2- "$runs" | sort | uniq -c | sort -rn
          else
            echo "(No completed workflow runs found)"
          fi
          echo ""

          selected=0
          deleted=0
          failed=0

          echo "========================================"
          echo " Matching Runs"
          echo "========================================"

          # Process each completed run
          while IFS=$'\t' read -r id name; do
            [[ -z "$id" ]] && continue

            # Apply optional workflow name filter
            if [[ -n "$workflow" && "$name" != "$workflow" ]]; then
              continue
            fi

            # Never delete the current cleanup run
            if [[ "$repo" == "$GITHUB_REPOSITORY" &&
                  "$id" == "$GITHUB_RUN_ID" ]]; then
              continue
            fi

            ((selected+=1))

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "WOULD DELETE: $id ($name)"
            else
              echo "DELETING: $id ($name)"

              if gh api -X DELETE \
                "repos/$repo/actions/runs/$id" >/dev/null; then
                ((deleted+=1))
              else
                echo "::warning::Failed to delete run $id"
                ((failed+=1))
              fi
            fi

          done < "$runs"

          if (( selected == 0 )); then
            echo "No matching completed runs found."
            if [[ -n "$workflow" ]]; then
              echo "Check that the workflow name is correct."
              echo "Leave the workflow field blank to select all workflows."
            fi
          fi

          echo ""
          echo "========================================"
          echo " Cleanup Results"
          echo "========================================"
          echo "Completed runs found: $total"
          echo "Matching runs:       $selected"
          echo "Deleted:             $deleted"
          echo "Failed:              $failed"
          echo "Preview only:        $DRY_RUN"

          # Write summary
          {
            echo "### Results"
            echo ""
            echo "| Metric | Count |"
            echo "| :--- | ---: |"
            echo "| Completed runs found | $total |"
            echo "| Matching runs | $selected |"
            echo "| Deleted | $deleted |"
            echo "| Failed | $failed |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if (( selected == 0 )); then
            echo "**No matching completed runs found.**" \
              >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "**Preview only. No runs were deleted.**" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Deleted $deleted workflow runs.**" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if (( failed > 0 )); then
            exit 1
          fi
